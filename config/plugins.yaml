
plugins:
  defamatory_detection:
    enabled: true
    description: "誹謗中傷的な投稿を検出して警告"
    priority: 1
    
  admin_channel_guard:
    enabled: true
    description: "運営チャンネルの投稿を監視"
    priority: 2
    
  url_spam_detection:
    enabled: true
    description: "複数URLや怪しいドメインのスパムを検出"
    priority: 3

global:
  admin_users:
    - "U1234567890"  # 例: 運営メンバー1
    - "U0987654321"  # 例: 運営メンバー2
  
  general_channel: "C093DQZS57S"  # テストチャンネル
  moderator_channel: "C093DQZS57S"  # テストチャンネル（モデレーター通知用）
  
  excluded_channels:
    - "C9999999999"  # 例: 除外チャンネル
